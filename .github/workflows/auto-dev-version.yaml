on:
  push:
    branches:
      - develop
name: auto-dev-version

permissions:
  contents: read

concurrency:
  group: auto-dev-version
  cancel-in-progress: false

jobs:
  auto-dev-version:
    if: >-
      github.repository == 'remindmodel/remind' &&
      !startsWith(github.event.head_commit.message, 'Release development version')
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/develop
          fetch-depth: 0
          persist-credentials: false

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@31b3198b2de324472547fecec2c0f721b70c38e2 # v0.9.15
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@31b3198b2de324472547fecec2c0f721b70c38e2 # v0.9.15
        with:
          useConfigFile: true
          configFilePath: .github/GitVersion.yml

      - name: Update CITATION.cff and config/default.cfg with version and date
        env:
          VERSION: ${{ steps.gitversion.outputs.assemblySemVer }}
        run: |
          sed -i "s/^version:.*$/version: \"$VERSION\"/" CITATION.cff
          sed -i "s/^date-released:.*$/date-released: $(date --iso)/" CITATION.cff
          sed -i "s/^cfg\$model_version <-.*$/cfg\$model_version <- \"$VERSION\"/" config/default.cfg

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REMIND_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.REMIND_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and tag
        env:
          VERSION: ${{ steps.gitversion.outputs.assemblySemVer }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add CITATION.cff config/default.cfg
          git commit -m "Release development version $VERSION"
          git tag "v$VERSION"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraHeader="Authorization: Basic ${AUTH}" push --atomic "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:develop "v$VERSION"
